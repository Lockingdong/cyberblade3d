version: "3"

dotenv: [".env"]

tasks:
  setup:
    desc: Install JavaScript and Go dependencies
    cmds:
      - pnpm install
      - go -C services/api mod download

  dev:
    desc: Run the API service and the web/mobile apps
    cmd: task --parallel dev:api dev:web dev:mobile

  dev:api:
    desc: Start the API service
    cmd: go -C services/api run ./cmd/api

  dev:web:
    desc: Start the web app development server
    cmd: pnpm -C apps/web dev

  dev:mobile:
    desc: Start the Expo application
    cmd: pnpm -C apps/mobile dev

  check:
    desc: Run all static checks and tests
    cmds:
      - pnpm -r --if-present typecheck
      - pnpm -r --if-present test
      - go -C services/api test ./...

  build:
    desc: Build all apps and services
    cmds:
      - pnpm -r --if-present build
      - go -C services/api build ./...

  format:
    desc: Format TypeScript, JSON, YAML and Go
    cmds:
      - pnpm exec prettier --write "{apps,packages,scripts,docs}/**/*.{ts,tsx,json,css,md,yml}"
      - gofmt -w services/api
