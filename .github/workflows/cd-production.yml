name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Target to deploy from the selected main commit
        required: true
        default: auto
        type: choice
        options:
          - auto
          - web
          - server
          - mobile-ota
          - mobile-native
          - all

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  detect:
    name: Detect deployment targets
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.targets.outputs.web }}
      server: ${{ steps.targets.outputs.server }}
      mobile: ${{ steps.targets.outputs.mobile }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: targets
        name: Classify changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          TARGET_OVERRIDE: ${{ inputs.target || 'auto' }}
        run: |
          node scripts/ci/detect-deploy-targets.mjs \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --override "$TARGET_OVERRIDE" \
            >> "$GITHUB_OUTPUT"

      - name: Summarize
        env:
          WEB: ${{ steps.targets.outputs.web }}
          SERVER: ${{ steps.targets.outputs.server }}
          MOBILE: ${{ steps.targets.outputs.mobile }}
        run: |
          {
            echo "## Production targets"
            echo
            echo "- Web: \`$WEB\`"
            echo "- Server: \`$SERVER\`"
            echo "- Mobile: \`$MOBILE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Verify production revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci/detect-deploy-targets.test.mjs
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - run: go -C services/api test ./...

  deploy-server:
    name: Deploy server
    needs: [detect, quality]
    if: >-
      needs.detect.outputs.server == 'true' &&
      vars.ENABLE_SERVER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-server
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve immutable image name
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Request provider deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.SERVER_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.SERVER_DEPLOY_HOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          payload="$(jq -n \
            --arg image "$IMAGE" \
            --arg revision "$REVISION" \
            '{image: $image, revision: $revision}')"
          if [[ -n "$DEPLOY_HOOK_TOKEN" ]]; then
            curl --fail-with-body --retry 3 \
              -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          else
            curl --fail-with-body --retry 3 \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          fi

      - name: Verify health
        env:
          HEALTH_URL: ${{ vars.SERVER_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl --fail-with-body --retry 12 --retry-all-errors \
            --retry-delay 5 \
            "$HEALTH_URL"

  server-gate:
    name: Server deployment gate
    if: always()
    needs: [detect, quality, deploy-server]
    runs-on: ubuntu-latest

    steps:
      - name: Require server when enabled and affected
        env:
          SERVER_AFFECTED: ${{ needs.detect.outputs.server }}
          SERVER_ENABLED: ${{ vars.ENABLE_SERVER_DEPLOY }}
          WEB_AFFECTED: ${{ needs.detect.outputs.web }}
          WEB_ENABLED: ${{ vars.ENABLE_WEB_DEPLOY }}
          MOBILE_AFFECTED: ${{ needs.detect.outputs.mobile }}
          MOBILE_ENABLED: ${{ vars.ENABLE_MOBILE_DEPLOY }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          if [[ "$SERVER_AFFECTED" == "true" && "$SERVER_ENABLED" == "true" ]]; then
            test "$SERVER_RESULT" = "success"
          fi
          if [[ "$SERVER_AFFECTED" == "true" && "$SERVER_ENABLED" != "true" ]]; then
            if [[ "$WEB_AFFECTED" == "true" && "$WEB_ENABLED" == "true" ]] ||
               [[ "$MOBILE_AFFECTED" != "none" && "$MOBILE_ENABLED" == "true" ]]; then
              echo "::error::A client release cannot proceed while its affected Server deployment is disabled."
              exit 1
            fi
          fi

  deploy-web:
    name: Deploy web
    needs: [detect, quality, server-gate]
    if: >-
      needs.detect.outputs.web == 'true' &&
      vars.ENABLE_WEB_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve immutable image name
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Require public WebSocket URL
        env:
          PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: test -n "$PUBLIC_WS_URL"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_PUBLIC_WS_URL=${{ vars.PUBLIC_WS_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Request provider deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.WEB_DEPLOY_HOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          payload="$(jq -n \
            --arg image "$IMAGE" \
            --arg revision "$REVISION" \
            '{image: $image, revision: $revision}')"
          if [[ -n "$DEPLOY_HOOK_TOKEN" ]]; then
            curl --fail-with-body --retry 3 \
              -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          else
            curl --fail-with-body --retry 3 \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          fi

      - name: Verify web
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          test -n "$WEB_URL"
          curl --fail-with-body --retry 12 --retry-all-errors \
            --retry-delay 5 \
            "$WEB_URL"

  deploy-mobile:
    name: Deploy mobile (${{ needs.detect.outputs.mobile }})
    needs: [detect, quality, server-gate]
    if: >-
      needs.detect.outputs.mobile != 'none' &&
      vars.ENABLE_MOBILE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    concurrency:
      group: production-mobile
      cancel-in-progress: false

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Publish production OTA update
        if: needs.detect.outputs.mobile == 'ota'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BEYBLADE_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: >-
          pnpm dlx eas-cli@21.1.0 update
          --channel production
          --environment production
          --message "${{ github.sha }}"
          --non-interactive

      - name: Build and submit production binaries
        if: needs.detect.outputs.mobile == 'native'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_BEYBLADE_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: >-
          pnpm dlx eas-cli@21.1.0 build
          --platform all
          --profile production
          --auto-submit
          --non-interactive
