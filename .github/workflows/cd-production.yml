name: Deploy Production

on:
  push:
    tags:
      - web-v*
      # Reserved for future production deployment workflows:
      # - server-v*
      # - mobile-v*

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    name: Verify production revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate Web release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Web release tags must use web-v<major>.<minor>.<patch>."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - run: go -C services/api test ./...

  deploy-web:
    name: Deploy web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build production Web assets
        env:
          VITE_PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: pnpm -C apps/web build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm -C apps/web deploy --
          --message "${{ github.ref_name }} (${{ github.sha }})"
          --tag "${{ github.ref_name }}"

      - name: Verify web
        if: ${{ vars.WEB_URL != '' }}
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          test -n "$WEB_URL"
          curl --fail-with-body --retry 12 --retry-all-errors \
            --retry-delay 5 \
            "$WEB_URL"
