name: Deploy Production

on:
  push:
    tags:
      - web-v*
      # Reserved for future production deployment workflows:
      # - server-v*
      # - mobile-v*

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  quality:
    name: Verify production revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate Web release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Web release tags must use web-v<major>.<minor>.<patch>."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - run: go -C services/api test ./...

  deploy-web:
    name: Deploy web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve immutable image name
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Require public WebSocket URL
        env:
          PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: test -n "$PUBLIC_WS_URL"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            VITE_PUBLIC_WS_URL=${{ vars.PUBLIC_WS_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Request provider deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.WEB_DEPLOY_HOOK_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          payload="$(jq -n \
            --arg image "$IMAGE" \
            --arg revision "$REVISION" \
            '{image: $image, revision: $revision}')"
          if [[ -n "$DEPLOY_HOOK_TOKEN" ]]; then
            curl --fail-with-body --retry 3 \
              -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          else
            curl --fail-with-body --retry 3 \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$DEPLOY_HOOK_URL"
          fi

      - name: Verify web
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          test -n "$WEB_URL"
          curl --fail-with-body --retry 12 --retry-all-errors \
            --retry-delay 5 \
            "$WEB_URL"
